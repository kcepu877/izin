function hitung2DBelakang(result) {
    if (!result || result.length < 4) return '-';
    var d1 = parseInt(result[2]);
    var d2 = parseInt(result[3]);
    var total = d1 + d2;
    while (total >= 10) total = Math.floor(total / 10) + (total % 10);
    return total;
}

function reduceToSingleDigit(n) {
    n = Math.abs(n);
    while (n >= 10) {
        var sum = 0;
        var temp = n;
        while (temp > 0) {
            sum += temp % 10;
            temp = Math.floor(temp / 10);
        }
        n = sum;
    }
    return n;
}

function hitungOperasi(a, b, op) {
    if (!op || op === '') return a;
    var hasil;
    if (op === '+') hasil = a + b;
    else if (op === '-') hasil = a - b;
    else hasil = a * b;
    if (hasil === 0) return a;
    return reduceToSingleDigit(hasil);
}

function applyConversi(value, convKey) {
    if (!convKey || convKey === 'n0') return value;
    var mapKey = CONVERSI_MAP[convKey];
    if (!mapKey || !MAP[mapKey]) return value;
    var mapped = MAP[mapKey][String(value)];
    if (mapped) {
        return mapped;
    }
    return String(value);
}

function getDigitFromConversi(value, convKey) {
    var hasil = applyConversi(value, convKey);
    if (typeof hasil === 'string' && hasil.length >= 3) {
        return parseInt(hasil[0]);
    }
    return parseInt(hasil) || value;
}

function generateDigit(x, jumlah) {
    var hasil = '';
    for (var i = 0; i < jumlah; i++) {
        var digit = (x + i) % 10;
        hasil += digit;
    }
    return hasil;
}

function getTarget(nextResult) {
    if (!nextResult) return [];
    var posMap = POSISI_MAP[POSISI] || POSISI_MAP['e'];
    return posMap.map(function(idx) { return nextResult[idx]; });
}

function detectLurusMerah(data, digit) {
    if (!data || data.length < 3) return null;
    if (!selectedCombination) return null;
    
    var huruf = 'ABCDEFGHIJ';
    var results = [];
    
    for (var pos = 0; pos < digit; pos++) {
        var consecutive = 0;
        var maxConsecutive = 0;
        var startBaris = 0;
        var endBaris = 0;
        var totalMerah = 0;
        
        for (var i = 0; i < data.length - 1; i++) {
            var baris = data[i];
            var nextResult = data[i + 1];
            var arr1 = [+baris[0], +baris[1], +baris[2], +baris[3]];
            
            var keyInfo = KEY_MAP[selectedCombination.key1];
            if (!keyInfo) continue;
            
            var dataIndex = i - keyInfo.offset;
            var dataSource = currentData;
            var data1 = (dataIndex >= 0 && dataIndex < dataSource.length) ? dataSource[dataIndex] : baris;
            var arrData = [+data1[0], +data1[1], +data1[2], +data1[3]];
            
            var nilaiA = 0;
            for (var p = 0; p < keyInfo.posisi.length; p++) {
                nilaiA += arrData[keyInfo.posisi[p]];
            }
            if (keyInfo.posisi.length > 1) {
                nilaiA = reduceToSingleDigit(nilaiA);
            }
            
            var hasilReduksi = nilaiA;
            
            if (selectedCombination.key2 && selectedCombination.key2 !== '' && selectedCombination.op && selectedCombination.op !== '') {
                var keyInfo2 = KEY_MAP[selectedCombination.key2];
                if (keyInfo2) {
                    var dataIndex2 = i - keyInfo2.offset;
                    var data2 = (dataIndex2 >= 0 && dataIndex2 < dataSource.length) ? dataSource[dataIndex2] : baris;
                    var arrData2 = [+data2[0], +data2[1], +data2[2], +data2[3]];
                    
                    var nilaiB = 0;
                    for (var p2 = 0; p2 < keyInfo2.posisi.length; p2++) {
                        nilaiB += arrData2[keyInfo2.posisi[p2]];
                    }
                    if (keyInfo2.posisi.length > 1) {
                        nilaiB = reduceToSingleDigit(nilaiB);
                    }
                    
                    var convVal1 = getDigitFromConversi(nilaiA, selectedCombination.conversi1);
                    var convVal2 = getDigitFromConversi(nilaiB, selectedCombination.conversi2);
                    var hasil = hitungOperasi(convVal1, convVal2, selectedCombination.op);
                    hasilReduksi = getDigitFromConversi(hasil, selectedCombination.conversiHasil);
                }
            } else {
                hasilReduksi = getDigitFromConversi(nilaiA, selectedCombination.conversi1);
            }
            
            var keyDigits = generateDigit(hasilReduksi, digit);
            var targetValues = getTarget(nextResult);
            
            var digitVal = parseInt(keyDigits[pos]);
            var isMerah = targetValues.indexOf(String(digitVal)) !== -1;
            
            if (isMerah) {
                consecutive++;
                totalMerah++;
                if (consecutive > maxConsecutive) {
                    maxConsecutive = consecutive;
                    startBaris = i - consecutive + 2;
                    endBaris = i + 1;
                }
            } else {
                consecutive = 0;
            }
        }
        
        results.push({
            posisi: pos,
            huruf: huruf[pos],
            count: maxConsecutive,
            totalMerah: totalMerah,
            startBaris: startBaris,
            endBaris: endBaris
        });
    }
    
    results.sort(function(a, b) {
        if (b.count !== a.count) return b.count - a.count;
        return b.totalMerah - a.totalMerah;
    });
    
    var best = results[0];
    
    if (best.count === 0 && best.totalMerah === 0) {
        return null;
    }
    
    var lastBaris = data[data.length - 1];
    var lastArr = [+lastBaris[0], +lastBaris[1], +lastBaris[2], +lastBaris[3]];
    
    var lastKeyInfo = KEY_MAP[selectedCombination.key1];
    if (!lastKeyInfo) return null;
    
    var lastDataIndex = (data.length - 1) - lastKeyInfo.offset;
    var lastDataSource = currentData;
    var lastData1 = (lastDataIndex >= 0 && lastDataIndex < lastDataSource.length) ? lastDataSource[lastDataIndex] : lastBaris;
    var lastArrData = [+lastData1[0], +lastData1[1], +lastData1[2], +lastData1[3]];
    
    var lastNilaiA = 0;
    for (var p = 0; p < lastKeyInfo.posisi.length; p++) {
        lastNilaiA += lastArrData[lastKeyInfo.posisi[p]];
    }
    if (lastKeyInfo.posisi.length > 1) {
        lastNilaiA = reduceToSingleDigit(lastNilaiA);
    }
    
    var lastHasilReduksi = lastNilaiA;
    
    if (selectedCombination.key2 && selectedCombination.key2 !== '' && selectedCombination.op && selectedCombination.op !== '') {
        var lastKeyInfo2 = KEY_MAP[selectedCombination.key2];
        if (lastKeyInfo2) {
            var lastDataIndex2 = (data.length - 1) - lastKeyInfo2.offset;
            var lastData2 = (lastDataIndex2 >= 0 && lastDataIndex2 < lastDataSource.length) ? lastDataSource[lastDataIndex2] : lastBaris;
            var lastArrData2 = [+lastData2[0], +lastData2[1], +lastData2[2], +lastData2[3]];
            
            var lastNilaiB = 0;
            for (var p2 = 0; p2 < lastKeyInfo2.posisi.length; p2++) {
                lastNilaiB += lastArrData2[lastKeyInfo2.posisi[p2]];
            }
            if (lastKeyInfo2.posisi.length > 1) {
                lastNilaiB = reduceToSingleDigit(lastNilaiB);
            }
            
            var lastConvVal1 = getDigitFromConversi(lastNilaiA, selectedCombination.conversi1);
            var lastConvVal2 = getDigitFromConversi(lastNilaiB, selectedCombination.conversi2);
            var lastHasil = hitungOperasi(lastConvVal1, lastConvVal2, selectedCombination.op);
            lastHasilReduksi = getDigitFromConversi(lastHasil, selectedCombination.conversiHasil);
        }
    } else {
        lastHasilReduksi = getDigitFromConversi(lastNilaiA, selectedCombination.conversi1);
    }
    
    var lastKeyDigits = generateDigit(lastHasilReduksi, digit);
    var topDigit = parseInt(lastKeyDigits[best.posisi]);
    
    return {
        posisi: best.posisi,
        huruf: best.huruf,
        top: topDigit,
        count: best.count,
        totalMerah: best.totalMerah,
        startBaris: best.startBaris,
        endBaris: best.endBaris
    };
}

function hitungBaris(baris, nextResult, index) {
    resetWarna();
    var arr1 = [+baris[0], +baris[1], +baris[2], +baris[3]];
    var target = getTarget(nextResult);
    var jml = hitung2DBelakang(baris);
    var tds = '<td>' + baris + '</td><td>' + jml + '</td>';
    
    var combo = selectedCombination;
    var digit = combo ? combo.digit : 3;
    
    if (combo) {
        var keyInfo = KEY_MAP[combo.key1];
        if (!keyInfo) return '<tr>' + tds + '</tr>';
        
        // Ambil data dengan OFFSET
        var dataIndex = index - keyInfo.offset;
        var dataSource = currentData;
        var data1 = (dataIndex >= 0 && dataIndex < dataSource.length) ? dataSource[dataIndex] : baris;
        var arrData = [+data1[0], +data1[1], +data1[2], +data1[3]];
        
        // Ambil nilai dari posisi key (bisa 1 atau 2 posisi)
        var nilaiA = 0;
        for (var p = 0; p < keyInfo.posisi.length; p++) {
            nilaiA += arrData[keyInfo.posisi[p]];
        }
        if (keyInfo.posisi.length > 1) {
            nilaiA = reduceToSingleDigit(nilaiA);
        }
        
        var hasilReduksi = nilaiA;
        
        // KALAU ADA KEY 2
        if (combo.key2 && combo.key2 !== '' && combo.op && combo.op !== '') {
            var keyInfo2 = KEY_MAP[combo.key2];
            if (keyInfo2) {
                var dataIndex2 = index - keyInfo2.offset;
                var data2 = (dataIndex2 >= 0 && dataIndex2 < dataSource.length) ? dataSource[dataIndex2] : baris;
                var arrData2 = [+data2[0], +data2[1], +data2[2], +data2[3]];
                
                var nilaiB = 0;
                for (var p2 = 0; p2 < keyInfo2.posisi.length; p2++) {
                    nilaiB += arrData2[keyInfo2.posisi[p2]];
                }
                if (keyInfo2.posisi.length > 1) {
                    nilaiB = reduceToSingleDigit(nilaiB);
                }
                
                var convVal1 = getDigitFromConversi(nilaiA, combo.conversi1);
                var convVal2 = getDigitFromConversi(nilaiB, combo.conversi2);
                var hasil = hitungOperasi(convVal1, convVal2, combo.op);
                hasilReduksi = getDigitFromConversi(hasil, combo.conversiHasil);
            }
        } else {
            hasilReduksi = getDigitFromConversi(nilaiA, combo.conversi1);
        }
        
        var hasil = generateDigit(hasilReduksi, digit);
        var cls = nextWarna();
        for (var k = 0; k < digit; k++) {
            var digitVal = hasil[k];
            var isCocok = target.length && target.indexOf(digitVal) !== -1;
            var c = isCocok ? 'cocok' : '';
            tds += '<td class="' + cls + ' ' + c + ' key-digit">' + digitVal + '</td>';
        }
    }
    
    return '<tr>' + tds + '</tr>';
}

    var posisiNama = POSISI.toUpperCase();
    var label = selectedCombination ? selectedCombination.label : 'A1';
    var judul = '📋 MANUAL | ' + posisiNama + ' | ' + label + ' | ' + data.length + ' Hari';
    var subInfo = '🔴 MERAH = ANGKA YANG SAMA DENGAN HASIL ' + posisiNama + ' DARI RESULT DI BAWAHNYA | ' + jumlahDigit + ' Digit';
    document.getElementById('info').innerHTML = '<div class="judul-tabel">' + judul + '</div><div class="sub-info">' + subInfo + '</div>';
    
    var html = buatHeader();
    for (var i = 0; i < data.length; i++) {
        var baris = data[i];
        var nextResult = (i + 1 < data.length) ? data[i + 1] : null;
        html += hitungBaris(baris, nextResult, i);
    }
    document.getElementById('tabel').innerHTML = html;
    
    if (selectedCombination) {
        var lurusResult = detectLurusMerah(data, selectedCombination.digit || 3);
        var topContainer = document.getElementById('topContainer');
        if (lurusResult) {
            topContainer.classList.add('show');
            document.getElementById('topNumber').textContent = lurusResult.top;
            document.getElementById('topBadge').textContent = 'LURUS ' + lurusResult.count;
            document.getElementById('topDetail').textContent = 'Posisi ' + lurusResult.huruf + ' | Baris ' + lurusResult.startBaris + '-' + lurusResult.endBaris + ' | Total MERAH: ' + lurusResult.totalMerah;
        } else {
            topContainer.classList.remove('show');
        }
    }
}

loadData();
render();
</script>
</body>
</html>
