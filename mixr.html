<html lang="id">

        <style>

        .header {
            border-bottom: 1px solid #00ff41;
            padding-bottom: 10px;
            margin-bottom: 20px;

            border-radius: 5px;

            text-align: center;

            border-color: #00ff41;

        }
        .menu-btn.active {
            background: #00ff41;
            color: #0a0a0a;
            border-color: #00ff41;
        }
        .menu-btn.pasar {

            color: #66aaff;
        }

            color: #fff;
            border-color: #0066ff;
        }
        .menu-btn.quit {

            color: #ff6666;
        }

            color: #fff;
        }
        .menu-btn.filter-btn {
            border-color: #ff8800;
            color: #ffaa44;
        }
        .menu-btn.filter-btn.active {

            color: #0a0a0a;

        .toggle-container {

            gap: 10px;
            padding: 6px 15px;
            background: #0d0d0d;

            border: 1px solid #2a2a2a;

        .toggle-switch.active {
            background: #00ff41;
            border-color: #00ff41;
        }

            height: 16px;
            background: #446644;

            left: 2px;

                <div class="thumb"></div>

        <!-- HIJAU OPTION (Baris Mati) -->
        <div class="hijau-option">

            <input type="number" id="tampilInput" value="40" min="5" max="40" onchange="setTampilOption()">
            <span style="color:#446644;font-size:10px;">baris</span>
        </div>
    </div>

    <div class="menu-grid">
        <div class="menu-section">
            <h4>📌 POSISI</h4>
            <button class="menu-btn active" onclick="runCommand('1')">AS</button>
            <button class="menu-btn" onclick="runCommand('2')">COP</button>

            <button class="menu-btn" onclick="runCommand('4')">EKOR</button><br>
            <button class="menu-btn" onclick="runCommand('5')">2D DP</button>
            <button class="menu-btn" onclick="runCommand('6')">2D BL</button>
            <button class="menu-btn" onclick="runCommand('7')">TENGAH</button>
            <button class="menu-btn" onclick="runCommand('8')">TEPI</button>
            <button class="menu-btn" onclick="runCommand('9')">KOMB</button><br>
            <button class="menu-btn" onclick="runCommand('10')">JML DP</button>
            <button class="menu-btn" onclick="runCommand('11')">JML BL</button>
            <button class="menu-btn" onclick="runCommand('12')">JML TG</button>
            <button class="menu-btn" onclick="runCommand('13')">JML TP</button>
            <button class="menu-btn" onclick="runCommand('14')">JML KB</button>
        </div>

        <div class="menu-section">
            
            <button class="menu-btn filter-btn" style="border-color:#44ff44;color:#44ff44;" onclick="scanAllFilters()">⚡ SCAN </button>
        </div>

        <div class="menu-section">
            <h4>🏪 PASAR</h4>
            <button class="menu-btn pasar active" onclick="runCommand('h')">HK</button>
            <button class="menu-btn pasar" onclick="runCommand('s')">SGP</button>
            <button class="menu-btn pasar" onclick="runCommand('sd')">SDNY</button>
        </div>

      
    </div>

    <div id="resultArea">
        <div class="no-result">🔍 Tekan SCAN untuk mulai cari angka Rumus</div>
    </div>
</div>

<div class="footer">

        <span class="status-dot"></span>

    <div>

    const POSISI_MAP = {
        as: [0], cop: [1], kepala: [2], ekor: [3],
        '2ddepan': [0, 1], '2dbelakang': [2, 3],
        tengah: [1, 2], tepi: [0, 3], kombinasi: [0, 1, 2, 3],
        'jumlah2ddepan': [0, 1], 'jumlah2dbelakang': [2, 3],
        'jumlahtengah': [1, 2], 'jumlahtepi': [0, 3],
        'jumlahkombinasi': [0, 1, 2, 3]
    };

    function generateKeyMap() {
        const map = {};
        const configs = {
            'a': [0], 'c': [1], 'k': [2], 'e': [3],
            'j': [2, 3], 'jt': [1, 2], 'jd': [0, 1]
        };
        for (let [key, positions] of Object.entries(configs)) {
            for (let num = 1; num <= 9; num++) {
                map[key + num] = { offset: num - 1, positions: positions };
            }
        }
        return map;
    }
    const KEY_MAP = generateKeyMap();

    const KEYS = [];
    for (let prefix of ['a', 'c', 'k', 'e', 'j', 'jt', 'jd']) {
        for (let num = 1; num <= 9; num++) {
            KEYS.push(prefix + num);
        }
    }

    const OPS = ['+', '-', '×'];
    const FILTERS = ['none', 'index', 'mlama', 'mbaru', 'taysen', 'M0', 'M1', 'M3', 'M5', 'M7', 'M8', 'M9'];
    const FILTER_LABEL = { 'none': '', 'index': 'ix', 'mlama': 'ml', 'mbaru': 'mb', 'taysen': 'ty', 'M0': 'm0', 'M1': 'm1', 'M3': 'm3', 'M5': 'm5', 'M7': 'm7', 'M8': 'm8', 'M9': 'm9' };

    function generateAllCombinations() {
        const ALL_COMBINATIONS = [];
        for (let key of KEYS) {
            for (let f of FILTERS) {
                ALL_COMBINATIONS.push({
                    key1: key, key2: null, op: null,
                    filter1: f, filter2: null,
                    label: key + FILTER_LABEL[f],
                    isSingle: true
                });
            }
        }
        for (let key1 of KEYS) {
            for (let op of OPS) {
                for (let key2 of KEYS) {
                    for (let f1 of FILTERS) {
                        for (let f2 of FILTERS) {
                            ALL_COMBINATIONS.push({
                                key1, key2, op,
                                filter1: f1, filter2: f2,
                                label: key1 + FILTER_LABEL[f1] + op + key2 + FILTER_LABEL[f2],
                                isSingle: false
                            });
                        }
                    }
                }
            }
        }
        return ALL_COMBINATIONS;
    }

    // ============================================================
    //  FUNGSI CARI ANGKA HILANG (YANG TIDAK ADA DI KEY)
    // ============================================================
    function getAngkaHilang(nilaiKey) {
        if (!nilaiKey) return '-';
        
        // Ambil digit-digit unik dari key
        let digits = new Set();
        for (let char of nilaiKey) {
            if (char >= '0' && char <= '9') {
                digits.add(char);
            }
        }
        
        // Cari angka 0-9 yang TIDAK ADA di key
        let hilang = [];
        for (let i = 0; i <= 9; i++) {
            if (!digits.has(String(i))) {
                hilang.push(i);
            }
        }
        
        // Jika semua angka 0-9 ada (key 10 digit), return '-'
        if (hilang.length === 0) return '-';
        if (hilang.length === 10) return '0'; // Key kosong / tidak valid
        
        return hilang.join('');
    }

    function reduceToSingleDigit(n) {
        n = Math.abs(n);
        while (n >= 10) {
            let sum = 0;
            while (n > 0) {
                sum += n % 10;
                n = Math.floor(n / 10);
            }
            n = sum;
        }
        return n;
    }

    function hitungOperasi(a, b, op) {
        let hasil;
        if (op === '+') hasil = a + b;
        else if (op === '-') hasil = a - b;
        else hasil = a * b;
        if (hasil === 0) return a;
        return reduceToSingleDigit(hasil);
    }

    function convert10(d, filter) {
        let map = MAP10[filter] || MAP10['rumus'];
        let hasil = map?.[d] || d;
        return hasil;
    }

    function trimDigit(str) {
        if (!str) return str;
        if (str.length <= DIGIT_KEY) return str;
        return str.slice(-DIGIT_KEY);
    }

    function getTarget(nextResult) {
        if (!nextResult) return [];
        let idxList = POSISI_MAP[POSISI] || [];
        if (POSISI.startsWith('jumlah')) {
            let total = 0;
            for (let idx of idxList) {
                total += parseInt(nextResult[idx]);
            }
            return ['' + reduceToSingleDigit(total)];
        }
        return idxList.map(idx => nextResult[idx]);
    }

    function hitungNilaiKeyWithFilter(combo, baris, allData, currentIndex, filter) {
        const f = filter || 'rumus';
        
        if (combo.isSingle) {
            let pos1 = KEY_MAP[combo.key1] || { offset: 0, positions: [0] };
            let dataIndex1 = currentIndex - pos1.offset;
            let data1;
            if (dataIndex1 >= 0 && dataIndex1 < allData.length) {
                data1 = allData[dataIndex1];
            } else {
                data1 = allData[0] || baris;
            }

            let nilaiA = 0;
            for (let pos of pos1.positions) {
                nilaiA += parseInt(data1[pos]);
            }
            if (pos1.positions.length > 1) {
                nilaiA = reduceToSingleDigit(nilaiA);
            }

            if (combo.filter1 !== 'none') {
                let temp = MAP10[combo.filter1]?.[nilaiA];
                if (temp !== undefined) {
                    nilaiA = parseInt(temp[1]);
                }
            }

            let hasil = convert10(nilaiA, f);
            return trimDigit(hasil);
        }

        let pos1 = KEY_MAP[combo.key1] || { offset: 0, positions: [0] };
        let pos2 = KEY_MAP[combo.key2] || { offset: 0, positions: [0] };

        let dataIndex1 = currentIndex - pos1.offset;
        let dataIndex2 = currentIndex - pos2.offset;

        let data1, data2;
        if (dataIndex1 >= 0 && dataIndex1 < allData.length) {
            data1 = allData[dataIndex1];
        } else {
            data1 = allData[0] || baris;
        }

        if (dataIndex2 >= 0 && dataIndex2 < allData.length) {
            data2 = allData[dataIndex2];
        } else {
            data2 = allData[0] || baris;
        }

        let nilaiA = 0;
        for (let pos of pos1.positions) {
            nilaiA += parseInt(data1[pos]);
        }
        if (pos1.positions.length > 1) {
            nilaiA = reduceToSingleDigit(nilaiA);
        }

        if (combo.filter1 !== 'none') {
            let temp = MAP10[combo.filter1]?.[nilaiA];
            if (temp !== undefined) {
                nilaiA = parseInt(temp[1]);
            }
        }

        let nilaiB = 0;
        for (let pos of pos2.positions) {
            nilaiB += parseInt(data2[pos]);
        }
        if (pos2.positions.length > 1) {
            nilaiB = reduceToSingleDigit(nilaiB);
        }

        if (combo.filter2 !== 'none') {
            let temp = MAP10[combo.filter2]?.[nilaiB];
            if (temp !== undefined) {
                nilaiB = parseInt(temp[1]);
            }
        }

        let hasilReduksi = hitungOperasi(nilaiA, nilaiB, combo.op);
        let hasil = convert10(hasilReduksi, f);
        return trimDigit(hasil);
    }

    // ============================================================
    //  LOGIC: MERAH WAJIB di atas + HIJAU WAJIB di N baris terakhir
    // ============================================================
    function scanKeyForMati(data, allData, filter, progressCallback) {
        const ALL_COMBINATIONS = generateAllCombinations();
        let results = {};
        let totalCombos = ALL_COMBINATIONS.length;
        let processed = 0;

        for (let combo of ALL_COMBINATIONS) {
            let keyLabel = combo.label;
            let detailBaris = [];
            let totalHijau = 0;
            let totalMerah = 0;

            let lastData = data.slice(-JUMLAH_TAMPIL);
            
            for (let i = 0; i < lastData.length - 1; i++) {
                let baris = lastData[i];
                let currentIndex = allData.length - lastData.length + i;
                let nextResult = lastData[i + 1];

                let nilai = hitungNilaiKeyWithFilter(combo, baris, allData, currentIndex, filter);

                let barisInfo = {
                    index: i + 1,
                    data: baris,
                    target: getTarget(nextResult),
                    nilai: nilai,
                    isHijau: false,
                    isMerah: false
                };

                let target = getTarget(nextResult);
                
                let masuk = false;
                for (let pos = 0; pos < Math.min(10, nilai.length); pos++) {
                    if (target.includes(nilai[pos])) {
                        masuk = true;
                        break;
                    }
                }
                
                if (masuk) {
                    totalMerah++;
                    barisInfo.isMerah = true;
                } else {
                    totalHijau++;
                    barisInfo.isHijau = true;
                }

                detailBaris.push(barisInfo);
            }

            let lastNBaris = detailBaris.slice(-HIJAU_BARIS);
            let hijauCountLastN = 0;
            for (let b of lastNBaris) {
                if (b.isHijau) hijauCountLastN++;
            }

            let aboveBaris = detailBaris.slice(0, -HIJAU_BARIS);
            let merahCountAbove = 0;
            for (let b of aboveBaris) {
                if (b.isMerah) merahCountAbove++;
            }

            if (hijauCountLastN >= HIJAU_BARIS && 
                aboveBaris.length > 0 && 
                merahCountAbove === aboveBaris.length) {
                
                // Ambil nilai key terakhir untuk prediksi
                let nilaiKey = '';
                if (detailBaris.length > 0) {
                    let lastBaris = detailBaris[detailBaris.length - 1];
                    if (lastBaris && lastBaris.nilai) {
                        nilaiKey = lastBaris.nilai;
                    }
                }
                
                results[keyLabel] = {
                    totalHijau: totalHijau,
                    totalMerah: totalMerah,
                    hijauLastN: hijauCountLastN,
                    merahAbove: merahCountAbove,
                    totalAbove: aboveBaris.length,
                    baris: detailBaris,
                    totalBaris: detailBaris.length,
                    nilaiKey: nilaiKey // Simpan nilai key untuk prediksi
                };
            }

            processed++;
            if (progressCallback && processed % 100 === 0) {
                let percent = (processed / totalCombos) * 100;
                progressCallback(percent, `Memproses ${processed}/${totalCombos} kombinasi...`);
            }
        }

        return results;
    }

    async function load(p) {
        P = p;
        const statusBar = document.getElementById('statusBar');
        statusBar.innerHTML = `⏳ Loading ${p.toUpperCase()}...`;

        if (!D[p]) {
            try {
                let url = URL_DATA[p];
                let response = await fetch(url);
                let text = await response.text();
                let lines = text.trim().split('\n')
                    .map(x => x.trim())
                    .filter(x => x.length >= 4 && /^\d+$/.test(x))
                    .map(x => x.slice(0, 4));

                if (lines.length === 0) {
                    lines = ['1234', '5678', '9012', '3456', '7890', '2345', '6789', '0123', '4567', '8901'];
                }

                D[p] = lines;
                statusBar.innerHTML = `✅ Load ${lines.length} data`;
            } catch (e) {
                let lines = ['1234', '5678', '9012', '3456', '7890', '2345', '6789', '0123', '4567', '8901'];
                D[p] = lines;
                statusBar.innerHTML = `📊 Pakai data contoh (${D[p].length} data)`;
            }
        }
        
        showDataOnly();
        
        if (AUTO_SCAN && !IS_SCANNING) {
            scanAllFilters();
        } else {
            document.getElementById('statusBar').innerHTML = `✅ Data ${p.toUpperCase()} siap. Klik SCAN untuk cari angka jitu.`;
        }

        let filter = filterList[currentFilterIndex];
        updateProgress(5 + (currentFilterIndex / totalFilters) * 85, 
            `Scanning filter ${filter.toUpperCase()}... (${currentFilterIndex+1}/${totalFilters})`);

        // Gunakan setTimeout agar UI update
        setTimeout(() => {
            let results = scanKeyForMati(data, allData, filter, function(percent, text) {
                let totalProgress = 5 + ((currentFilterIndex + percent/100) / totalFilters) * 85;
                updateProgress(Math.min(95, totalProgress), text);
            });

            let sortedKeys = Object.keys(results).sort((a, b) => {
                return results[b].totalAbove - results[a].totalAbove;
            });
            allResults[filter] = { results, sortedKeys };
            totalKeysFound += sortedKeys.length;

            currentFilterIndex++;
            updateProgress(5 + (currentFilterIndex / totalFilters) * 85, 
                `Selesai ${filter.toUpperCase()} (${currentFilterIndex}/${totalFilters})`);

            // Delay 50ms antar filter
            setTimeout(scanNextFilter, 99999);
        }, 50);
    }

    scanNextFilter();
}

    function finishScan(allResults, totalKeysFound, data, filterLabel) {
        updateProgress(100, 'Selesai! Menampilkan hasil...');

        IS_SCANNING = false;

        const scanBtn = document.querySelector('.filter-btn[onclick*="scanAllFilters()"]');
        if (scanBtn) {
            scanBtn.textContent = '⚡ SCAN ';
            scanBtn.style.borderColor = '#44ff44';
            scanBtn.style.color = '#44ff44';
            scanBtn.disabled = false;
        }

        const resultArea = document.getElementById('resultArea');

        if (totalKeysFound === 0) {
            resultArea.innerHTML = `
                <div class="no-result">
                    ❌ TIDAK ADA KEY YANG MEMENUHI KRITERIA<br>
                    
                    <span style="font-size:12px;color:#446644;">
                        💡 Coba kurangi BARIS MATI (1-2) atau tambah TAMPIL (20-30)
                    </span>
                </div>
            `;
            document.getElementById('statusBar').innerHTML = `✅ Scan selesai. Tidak ada key ditemukan.`;
            return;
        }

        let html = buildResultHTML(allResults, totalKeysFound, data, filterLabel);
        resultArea.innerHTML = html;
        document.getElementById('statusBar').innerHTML = `✅ Scan selesai. ${totalKeysFound} key ditemukan!`;
    }

    // ============================================================
    //  BUILD RESULT HTML - DENGAN PREDIKSI ANGKA HILANG
    // ============================================================
    function buildResultHTML(allResults, totalKeysFound, data, filterLabel) {
        let html = `
        `;
        html += ``;
        
        html += `
        `;
        html += ``;

        let no = 1;
        for (let filter of Object.keys(allResults)) {
            let { results, sortedKeys } = allResults[filter];
            if (sortedKeys.length === 0) continue;

            for (let key of sortedKeys) {
                let info = results[key];
                
                let angkaKey = '';
                let angkaPrediksi = '';
                if (info.baris && info.baris.length > 0) {
                    let lastBaris = info.baris[info.baris.length - 1];
                    if (lastBaris && lastBaris.nilai) {
                        angkaKey = lastBaris.nilai;
                        // PREDIKSI = ANGKA YANG TIDAK ADA DI KEY
                        angkaPrediksi = getAngkaHilang(angkaKey);
                    }
                }

                html += `
                    
                `;
                no++;
            }
        }

        html += `
        `;

        // DETAIL PER FILTER
        html += `<div style="margin-top:20px;"><strong>📋 KEY DITEMUKAN (${totalKeysFound} Key):</strong></div>`;

        for (let filter of Object.keys(allResults)) {
            let { results, sortedKeys } = allResults[filter];
            if (sortedKeys.length === 0) continue;

            html += `<div style="margin-top:15px;padding:10px;background:#0d1a0d;border-left:3px solid #44ff44;border-radius:4px;">
                <strong style="color:#44ff44;">${filterLabel[filter] || filter} (${sortedKeys.length} key)</strong>
                <span style="color:#446644;margin-left:10px;">${HIJAU_BARIS} baris terakhir</span>
                
            </div>`;

            html += `<div class="table-wrap"><table class="detail-table">`;
            html += `<tr class="key-header-row"><th class="label-col hijau-label">KEY</th>`;
            for (let key of sortedKeys) {
                html += `<th style="text-align:center;font-size:11px;background:#1a2a3a;color:#88ddff;">${key}</th>`;
            }
            html += `<th style="text-align:center;font-size:11px;background:#1a2a0a;color:#ffaa00;">⭐ </th>`;
            html += `</tr>`;

            let maxBaris = 0;
            let allBarisData = [];
            let allPrediksi = [];
            
            for (let key of sortedKeys) {
                let info = results[key];
                let barisList = info.baris || [];
                allBarisData.push(barisList);
                if (barisList.length > maxBaris) maxBaris = barisList.length;
                
                let prediksi = '';
                if (barisList.length > 0) {
                    let lastBaris = barisList[barisList.length - 1];
                    if (lastBaris && lastBaris.nilai) {
                        prediksi = getAngkaHilang(lastBaris.nilai);
                    }
                }
                allPrediksi.push(prediksi);
            }

            for (let i = 0; i < maxBaris; i++) {
                let label = data[i] || '-';
                let isHijauZone = (i >= maxBaris - HIJAU_BARIS);
                let isAbove = (i < maxBaris - HIJAU_BARIS);
                
                html += `<tr class="data-row" style="${isHijauZone ? 'background:#0a1a0a;' : (isAbove ? 'background:#1a0a0a;' : '')}">`;
                html += `<td class="label-col" style="background:${isHijauZone ? '#0d1a0d' : (isAbove ? '#1a0d0d' : '#0d0d0d')};color:${isHijauZone ? '#44ff44' : (isAbove ? '#ff4444' : '#66ff99')};font-weight:bold;text-align:center;">
                    ${label}${isHijauZone ? ' 🟢' : (isAbove ? ' 🔴' : '')}
                </td>`;
                
                for (let j = 0; j < sortedKeys.length; j++) {
                    let barisList = allBarisData[j];
                    if (i < barisList.length) {
                        let baris = barisList[i];
                        let nilai = baris.nilai || '-';
                        let isHijau = baris.isHijau;
                        let isMerah = baris.isMerah;
                        
                        let displayNilai = '';
                        if (nilai !== '-') {
                            if (isHijau) {
                                displayNilai = `<span style="color:#44ff44;font-weight:bold;">${nilai}</span>`;
                            } else if (isMerah) {
                                displayNilai = `<span style="color:#ff4444;font-weight:bold;">${nilai}</span>`;
                            } else {
                                displayNilai = nilai;
                            }
                        } else {
                            displayNilai = '-';
                        }
                        let bgClass = isHijau ? 'bg-hijau' : (isMerah ? 'bg-merah' : '');
                        html += `<td style="text-align:center;font-size:13px;letter-spacing:1px;${bgClass}">${displayNilai}</td>`;
                    } else {
                        html += `<td style="text-align:center;color:#222;">-</td>`;
                    }
                }
                
                if (i === maxBaris - 1) {
                    html += `<td style="text-align:center;font-size:16px;font-weight:bold;color:#ffaa00;"></td>`;
                } else {
                    html += `<td style="text-align:center;color:#222;">-</td>`;
                }
                
                html += `</tr>`;
            }

            // Baris status dengan angka prediksi (angka hilang)
            html += `<tr>`;
            html += `<td class="label-col hijau-label">STATUS</td>`;
            for (let j = 0; j < sortedKeys.length; j++) {
                let barisList = allBarisData[j];
                let lastN = barisList.slice(-HIJAU_BARIS);
                let hijauCount = 0;
                for (let b of lastN) {
                    if (b.isHijau) hijauCount++;
                }
                let aboveBaris = barisList.slice(0, -HIJAU_BARIS);
                let merahCount = 0;
                for (let b of aboveBaris) {
                    if (b.isMerah) merahCount++;
                }
                let isFullHijau = (hijauCount >= HIJAU_BARIS);
                let isFullMerah = (merahCount === aboveBaris.length && aboveBaris.length > 0);
                
                let prediksi = allPrediksi[j] || '-';
                let statusText = '';
                if (isFullHijau && isFullMerah) {
                    statusText = `✅ ${prediksi}`;
                } else if (isFullHijau) {
                    statusText = `🟢 ${prediksi}`;
                } else if (isFullMerah) {
                    statusText = `🔴 ${prediksi}`;
                } else {
                    statusText = '❌';
                }
                html += `<td style="text-align:center;font-weight:bold;font-size:14px;color:${(isFullHijau && isFullMerah) ? '#44ff44' : '#ff4444'};">${statusText}</td>`;
            }
            html += `<td style="text-align:center;color:#ffaa00;font-size:14px;font-weight:bold;">⭐</td>`;
            html += `</tr>`;
            html += `</table></div>`;
        }

        return html;
    }

    // ============================================================
    //  RUN COMMAND
    // ============================================================
    function runCommand(cmd) {
        if (IS_SCANNING) {
            document.getElementById('statusBar').innerHTML = '⏳ Scan sedang berjalan... Tunggu sebentar!';
            return;
        }

        document.querySelectorAll('.menu-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        
        document.querySelectorAll(`.menu-btn[onclick*="runCommand('${cmd}')"]`).forEach(btn => {
            btn.classList.add('active');
        });

        const posisiMap = {
            '1': 'as', '2': 'cop', '3': 'kepala', '4': 'ekor',
            '5': '2ddepan', '6': '2dbelakang', '7': 'tengah', '8': 'tepi',
            '9': 'kombinasi',
            '10': 'jumlah2ddepan', '11': 'jumlah2dbelakang',
            '12': 'jumlahtengah', '13': 'jumlahtepi', '14': 'jumlahkombinasi'
        };

        const pasarMap = {
            'h': 'hk', 's': 'sgp', 'sd': 'sdny'
        };

        if (posisiMap[cmd]) {
            setPosisi(posisiMap[cmd]);
        } else if (pasarMap[cmd]) {
            load(pasarMap[cmd]);
        } else if (cmd === 'q' || cmd === 'quit' || cmd === 'exit') {
            if (confirm('Yakin ingin keluar?')) {
                document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;color:#00ff41;font-size:24px;">👋 Sampai jumpa!</div>';
            }
        }
    }

    // ============================================================
    //  TIMER & INIT
    // ============================================================
    setInterval(() => {
        document.getElementById('clock').textContent = updateClock();
    }, 1000);

    window.onload = function() {
        updateFooterDate();
        document.getElementById('hijauSelect').value = '3';
        document.getElementById('tampilInput').value = '40';
        load('hk');
    };
</script>
